version: 2
project_name: ccgate
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    binary: ccgate
    ldflags:
      - -s -w
      - -X main.version=v{{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
release:
  prerelease: auto
  # Maintainer drafts a release in the GitHub UI before tagging
  # (breaking-change notes / migration tips / GitHub-auto-generated
  # "What's Changed" PR list). goreleaser then attaches the build
  # artifacts to that draft and appends its commit-grouped changelog
  # below the maintainer's body. Default `mode: keep-existing` would
  # throw away the auto changelog entirely; we want both.
  use_existing_draft: true
  mode: append
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  use: github
  groups:
    - title: Breaking Changes
      regexp: '^.*!:'
      order: 0
    - title: Features
      regexp: '^feat'
      order: 1
    - title: Bug Fixes
      regexp: '^fix'
      order: 2
    - title: Refactoring
      regexp: '^refactor'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test'
      - '^ci'
      # docs and chore are kept: breaking-change migration notes often
      # land on docs / chore commits, and dropping them silently from
      # release notes hides them from users. Maintainers should still
      # cross-check release notes against CHANGELOG.md before tagging.
brews:
  - name: ccgate
    repository:
      owner: tak848
      name: homebrew-tap
      branch: "ccgate-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: tak848
          name: homebrew-tap
          branch: main
    directory: Formula
    homepage: "https://github.com/tak848/ccgate"
    description: "LLM-powered PermissionRequest hook for coding agents (e.g. Claude Code)"
    license: "MIT"
    test: |
      assert_match version.to_s, shell_output("#{bin}/ccgate --version")
